security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_RECRUITER, ROLE_CANDIDATE]
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: false
                default_target_path: app_dashboard
            custom_authenticator:
                - App\Security\GoogleAuthenticator
                - App\Security\FacebookAuthenticator
            entry_point: form_login
            logout:
                path: app_logout
                target: app_dashboard


    access_control:
        - { path: ^/profile/public, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_CANDIDATE }
        - { path: ^/positions/manage, roles: ROLE_RECRUITER }
        - { path: ^/attributes, roles: ROLE_RECRUITER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

