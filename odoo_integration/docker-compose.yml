services:
    db:
        image: postgres:15
        container_name: odoo_postgres
        restart: always
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=odoo
            - POSTGRES_PASSWORD=odoo
        volumes:
            - odoo_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    web:
        image: odoo:17.0
        container_name: odoo_web
        restart: always
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8069:8069"
        environment:
            - HOST=db
            - USER=odoo
            - PASSWORD=odoo
        command: -- -d cv_odoo --db_host=db -r odoo -w odoo
        volumes:
            - ./custom_addons:/mnt/extra-addons
            - odoo_web_data:/var/lib/odoo
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    odoo_db_data:
    odoo_web_data:

